name: Setup sing-box
description: Install the latest stable sing-box release from SagerNet
runs:
  using: composite
  steps:
    - name: Download and verify the latest stable release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in
          ARM64) arch=arm64 ;;
          X64) arch=amd64 ;;
          *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        release=$(curl --fail --silent --show-error --location \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          https://api.github.com/repos/SagerNet/sing-box/releases/latest)
        version=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name | capture("^v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$").version' <<< "$release")
        asset="sing-box-${version}-linux-${arch}.tar.gz"
        digest=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest | capture("^sha256:(?<hash>[a-f0-9]{64})$").hash' <<< "$release")

        install_dir=$(mktemp -d "$RUNNER_TEMP/sing-box.XXXXXX")
        curl --fail --silent --show-error --location \
          "https://github.com/SagerNet/sing-box/releases/download/v${version}/${asset}" \
          -o "$install_dir/$asset"
        (cd "$install_dir" && echo "$digest  $asset" | sha256sum --check)
        tar -xzf "$install_dir/$asset" -C "$install_dir"
        bin_dir="$install_dir/sing-box-${version}-linux-${arch}"
        "$bin_dir/sing-box" version
        echo "$bin_dir" >> "$GITHUB_PATH"
