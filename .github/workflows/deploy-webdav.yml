name: Sync, Build and Deploy to WebDAV
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync_upstream:
    name: Sync upstream with a signed merge
    if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Check sync credentials
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SYNC_TOKEN" || { echo 'UPSTREAM_SYNC_TOKEN is required' >&2; exit 1; }
          test -n "$GPG_PRIVATE_KEY" || { echo 'GPG_PRIVATE_KEY is required' >&2; exit 1; }
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Import commit signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Merge and push upstream
        id: sync
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/SukkaW/Surge.git master
          upstream_sha=$(git rev-parse FETCH_HEAD)
          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            # Keep this fork's CI configuration while merging upstream source changes.
            if ! git merge --no-ff --no-commit "$upstream_sha"; then
              test -n "$(git diff --name-only --diff-filter=U)" || exit 1
            fi
            git restore --source=HEAD --staged --worktree -- .github/workflows
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo 'Upstream source conflicts require manual resolution:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            git commit -S -m 'chore: sync SukkaW/Surge [skip ci]'
            git verify-commit HEAD
            git push origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: sync_upstream
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: smorimoto/tune-github-hosted-runner-network@v1
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync_upstream.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - name: Grab Building Folder
        id: ramdisk
        run: |
          echo "build_dir=previous-build-${{ github.run_id }}-${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Download Previous Build
        uses: actions/checkout@v6
        with:
          repository: SukkaLab/ruleset.skk.moe
          persist-credentials: false
          filter: "tree:0"
          fetch-tags: false
          path: ${{ steps.ramdisk.outputs.build_dir }}
      - name: Setup build folder
        run: |
          if [ ! -d ${{ steps.ramdisk.outputs.build_dir }}/.git ]; then
            echo ".git not found"
            exit 1
          fi
          rm -rf "${{ steps.ramdisk.outputs.build_dir }}/.git"

          if [ ! -d ${{ steps.ramdisk.outputs.build_dir }}/List ]; then
            echo "List not found"
            exit 1
          fi
          echo "public directory is ready: ${{ steps.ramdisk.outputs.build_dir }}"
      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "year=$(date +'%Y')" >> $GITHUB_OUTPUT
          echo "month=$(date +'%m')" >> $GITHUB_OUTPUT
          echo "day=$(date +'%d')" >> $GITHUB_OUTPUT
          echo "hour=$(date +'%H')" >> $GITHUB_OUTPUT
          echo "minute=$(date +'%M')" >> $GITHUB_OUTPUT
          echo "second=$(date +'%S')" >> $GITHUB_OUTPUT
      - name: Restore cache.db
        uses: actions/cache/restore@v5
        id: cache-db-restore
        with:
          path: |
            .cache
          key: ${{ runner.os }}-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }} ${{ steps.date.outputs.hour }}:${{ steps.date.outputs.minute }}:${{ steps.date.outputs.second }}
          restore-keys: |
            ${{ runner.os }}-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }} ${{ steps.date.outputs.hour }}:${{ steps.date.outputs.minute }}:
            ${{ runner.os }}-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }} ${{ steps.date.outputs.hour }}:
            ${{ runner.os }}-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }}
            ${{ runner.os }}-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-
            ${{ runner.os }}-v3-${{ steps.date.outputs.year }}-
            ${{ runner.os }}-v3-
      - run: pnpm install
      - name: Install latest stable sing-box
        uses: ./.github/actions/setup-sing-box
      - name: Test SRS compilation
        run: pnpm run test Build/build-singbox-srs.test.ts
      - run: pnpm run build
        env:
          PUBLIC_DIR: ${{ steps.ramdisk.outputs.build_dir }}
      - name: Pre-deploy check
        run: |
          if [ ! -d ${{ steps.ramdisk.outputs.build_dir }} ]; then
            echo "public directory not found"
            exit 1
          fi
          if [ ! "$(ls -A ${{ steps.ramdisk.outputs.build_dir }})" ]; then
            echo "public directory is empty"
            exit 1
          fi
          if [ ! -f .BUILD_FINISHED ]; then
            echo ".BUILD_FINISHED not found"
            exit 1
          fi
          echo "public directory is ready: ${{ steps.ramdisk.outputs.build_dir }}"
      - uses: actions/upload-artifact@v7
        with:
          name: build-artifact-${{ github.sha }}-${{ github.run_number }}
          path: ${{ steps.ramdisk.outputs.build_dir }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 4
          include-hidden-files: false
      - name: Cache cache.db
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .cache
          key: ${{ runner.os }}-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }} ${{ steps.date.outputs.hour }}:${{ steps.date.outputs.minute }}:${{ steps.date.outputs.second }}

  diff_deployment_on_pr:
    if: ${{ !cancelled() && !failure() && needs.build.result == 'success' && github.ref != 'refs/heads/master' }}
    needs:
      - build
    name: Diff output
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-artifact-${{ github.sha }}-${{ github.run_number }}
          path: public
      - name: Diff
        run: |
          git clone --filter=tree:0 --no-tags https://github.com/SukkaLab/ruleset.skk.moe.git ./deploy-git >/dev/null 2>&1
          cd ./deploy-git
          git fetch origin master >/dev/null 2>&1
          rm -rf ./*
          cp -rf ../public/* ./
          git --no-pager diff --minimal

  deploy_to_webdav:
    needs:
      - build
    name: Deploy to WebDAV
    if: ${{ !cancelled() && !failure() && needs.build.result == 'success' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-artifact-${{ github.sha }}-${{ github.run_number }}
          path: public
      - name: Upload to WebDAV
        shell: bash
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_PREFIX: ${{ vars.WEBDAV_PREFIX || secrets.WEBDAV_PREFIX || 'ruleset' }}
        run: |
          set -euo pipefail
          : "${WEBDAV_URL:?WEBDAV_URL is required}"
          : "${WEBDAV_USERNAME:?WEBDAV_USERNAME is required}"
          : "${WEBDAV_PASSWORD:?WEBDAV_PASSWORD is required}"
          WEBDAV_URL="${WEBDAV_URL%/}"
          WEBDAV_PREFIX="${WEBDAV_PREFIX%/}"

          cd public

          # Create directories
          while IFS= read -r dir; do
            if [ "$dir" = "." ]; then
              target_url="${WEBDAV_URL}/${WEBDAV_PREFIX}/"
            else
              target_url="${WEBDAV_URL}/${WEBDAV_PREFIX}/${dir#./}"
            fi
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -X MKCOL --user "$WEBDAV_USERNAME:$WEBDAV_PASSWORD" "$target_url")
            case "$status" in
              201|405) ;;
              *) echo "MKCOL failed for $dir (HTTP $status)" >&2; exit 1 ;;
            esac
          done < <(find . -type d | sort)

          # Upload files
          while IFS= read -r file; do
            rel="${file#./}"
            target_url="${WEBDAV_URL}/${WEBDAV_PREFIX}/${rel}"
            echo "PUT $rel"
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -T "$file" --user "$WEBDAV_USERNAME:$WEBDAV_PASSWORD" "$target_url")
            case "$status" in
              200|201|204) ;;
              *) echo "PUT failed for $rel (HTTP $status)" >&2; exit 1 ;;
            esac
          done < <(find . -type f | sort)

          echo "WebDAV upload complete"

  remove_artifacts:
    needs:
      - deploy_to_webdav
    name: Remove Artifacts after Deployment
    if: ${{ !cancelled() && needs.deploy_to_webdav.result == 'success' }}
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: build-artifact-${{ github.sha }}-${{ github.run_number }}
